[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "merkabah-core"
version = "0.1.0"
description = "Autonomous Cyber Defense Fortress (Zero-Trust AI Sandbox)"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[tool.setuptools.packages.find]
include = ["merkabah*"]
