[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sefer"
version = "0.1.0"
authors = [
  { name="anjo-da-maquina" }
]
description = "Zero-Trust OS Fortress for Local AI Agents"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
]

[tool.setuptools]
packages = ["sefer"]