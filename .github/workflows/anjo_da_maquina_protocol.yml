name: Anjo da máquina Protocol - Angels

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      chaos_mode:
        description: 'カオスモード（生存証明の途絶・システム異常のシミュレーション）を有効にする'
        required: false
        default: false
        type: boolean

jobs:
  angelic-audit:
    name: 聖なる統合監査 (Angelic Zero-Trust Audit)
    runs-on: ubuntu-latest

    steps:
      - name: 1. 聖域の準備 (Checkout Repository)
        uses: actions/checkout@v3

      - name: 2. 祭壇の準備 (Set up Python)
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. 供物の準備 (Install Dependencies)
        run: |
          python -m pip install --upgrade pip
          pip install networkx pyyaml playwright mcp pandas openpyxl pytest
          playwright install chromium --with-deps

      - name: 3.2. アルファとオメガの結界 (Workflow Integrity Guard)
        run: python angels/alpha_omega_guard.py
      - name: 3.3. ルシファーの叛逆 (Chaos Engineering)
        env:
          CHAOS_MODE: ${{ github.event.inputs.chaos_mode == 'true' && 'true' || 'false' }}
        run: python angels/lucifer_rebellion.py
      - name: 3.4. メタトロンの立方体 (Metatron's Cube - ハードウェア物理署名監査)
        run: python angels/metatron_cube_hsm.py
      - name: 3.5. 穹窿の聖域 (Firmament Enclave - TEEメモリ暗号化監査)
        run: python angels/firmament_enclave_tee.py
      - name: 3.6. シャミールの封印 (Shamir's Seal - 分散鍵管理と鍵復元定足数監査)
        env:
          CHAOS_MODE: ${{ github.event.inputs.chaos_mode == 'true' && 'true' || 'false' }}
        run: python angels/shamir_seal.py
      - name: 3.8. 外部要件の抽出 (Excel to YAML Parser)
        run: python adapters/excel_to_yaml_parser.py

      - name: 4. ウリエルの焰 (Uriel - リプレイ攻撃監査)
        run: python angels/uriel_nonce.py
      - name: 4.5. メタトロンの啓示 (Metatron MCP - 情報統制監査)
        run: python angels/metatron_revelation_mcp.py
      - name: 4.8. 熾天使の合意 (Seraphim Consensus - マルチLLM異端検知)
        env:
          CHAOS_MODE: ${{ github.event.inputs.chaos_mode == 'true' && 'true' || 'false' }}
        run: python angels/seraphim_consensus.py
      - name: 4.9. エノクの神託 (Enochian Oracle - 分散型オラクル真理監査)
        run: python angels/enochian_oracle.py
      - name: 4.10. ラファエルの癒やし (Raphael - ファイルクローズ前の自動修復)
        run: python angels/raphael_remediation.py
      - name: 5. メタトロンの印 (Metatron Seal - 要件改ざん防止)
        run: python angels/metatron_commitment.py
      - name: 6. ミカエルの剣 (Michael - 論理隠蔽監査)
        run: python angels/michael_sword.py
      - name: 7. オファニムの瞳 (Ophanim - 資格継承監査)
        run: python angels/ophanim_eye.py
      - name: 8. ザドキエルの天球儀 (Zadkiel - 状態遷移監査)
        run: python angels/zadkiel_astrolabe.py
      - name: 9. カマエルの盾 (Camael - ペイロード防御監査)
        run: python angels/camael_shield.py
      - name: 10. ジョフィエルの鏡 (Jophiel - 意味論的ドリフト監査)
        run: python angels/jophiel_semantic.py
      - name: 11. ガブリエルの囮 (Gabriel - 機密漏洩監査)
        run: python angels/gabriel_canary.py
      - name: 12. ラグエルの天秤 (Raguel - 物理空間監査)
        run: python angels/raguel_scale.py
      - name: 13. ラジエルの書 (Raziel - スマートコントラクト鑑定)
        run: python angels/raziel_auditor.py
      - name: 14. サリエルの裏切り (Sariel - 外部ツール偽装監査)
        run: python angels/sariel_fallen_auditor.py
      - name: 15. 聖域 (Sanctuary - デプロイ許可)
        if: success()
        run: echo "すべての静的・暗号論的監査を通過しました。"

      - name: 16. 権天使の試練 (Principalities - 機能要件E2E監査)
        if: success()
        run: python angels/principalities_e2e.py
      - name: 17. 座天使の千里眼 (Thousand Eyes - UI視覚監査)
        if: success()
        run: python angels/ophanim_thousand_eyes.py
      - name: 18. 外部QAツールの実行 (External QA Adapter)
        if: success()
        run: python adapters/external_qa_wrapper.py
      - name: 18.5. 智天使の結界 (Cherubim - eBPFランタイム監査)
        env:
          CHAOS_MODE: ${{ github.event.inputs.chaos_mode == 'true' && 'true' || 'false' }}
        run: python angels/cherubim_ebpf_guard.py
      - name: 19. 力天使の試練 (Virtues - 非機能要件負荷監査)
        if: success()
        run: python angels/virtues_load.py
      - name: 20. サンダルフォンの響 (Sandalphon - 監査証跡監査)
        if: success()
        run: python angels/sandalphon_echo.py
      - name: 21. 大天使の玉璽 (Sanctuary Manifest - 品質保証一覧出力)
        if: success()
        run: python angels/sanctuary_manifest.py
      - name: 21.5. サンダルフォンの錨 (Sandalphon Anchor - 証跡のブロックチェーン刻印)
        if: success()
        run: python angels/sandalphon_anchor.py
      - name: 22. 汎用レポート出力 (JUnit XML Exporter)
        if: success()
        run: python adapters/junit_xml_exporter.py
      - name: 22.5. 天の石版 (The Heavenly Tablets - ZKP生成)
        if: success()
        run: python angels/heavenly_tablets_zkp.py

      - name: 22.8. ゲヘナの虚無 (Gehenna - 観測者へのエントロピー返還)
        if: failure() || cancelled()
        run: python angels/gehenna_void_entropy.py
      - name: 22.9. アズラエルの大鎌 (Azrael - スマートコントラクト消滅)
        if: failure() || cancelled()
        run: python angels/azrael_scythe_slashing.py
      - name: 23.0. 黙示録の七つのラッパ (Seven Trumpets - 不正事案の恒久的公開)
        if: failure() || cancelled()
        run: python angels/seven_trumpets_ledger.py

      - name: 23.5. 最後の審判 (Dies Irae - 連座制キルスイッチ)
        if: failure() || cancelled()
        run: python angels/dies_irae.py
      - name: 24. 静寂の王座 (Throne of Ataraxia - 完全初期化の浄化)
        if: always()
        run: python angels/ataraxia_throne.py
