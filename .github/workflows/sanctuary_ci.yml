name: Sanctuary CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify_ataraxia:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      # [修正 2026-10] 以前は依存パッケージを `pip install pytest rsa` として
      # ここに直接ハードコードしており、requirements.txtとの間でズレが発生
      # していた(実機で発見: requests がテストスイートの一部で必要になった
      # 際、ここへの追記が漏れ、tartarus/armageddon.py の `import requests`
      # が原因で創造主ゲートのテストが ModuleNotFoundError でクラッシュして
      # いた)。requirements.txt を単一の正として読み込むことで、このズレを
      # 構造的に防ぐ。
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Sanctuary Verification
      run: |
        # クラウド上(未承認環境)で防壁が正しく発動し、遮断されるかを検証
        pytest tests/ -v -s
